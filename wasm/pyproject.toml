[project]
name = "wasm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "marimo>=0.13.3",
    "pandas>=2.2.3",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pip>=25.1",
    "pre-commit>=4.2.0",
    "ruff>=0.11.8",
]
[[tool.uv.index]]
name = "apple-pypi"
url = "https://pypi.apple.com/simple"

[[tool.uv.index]]
name = "apple-pypi-publish"
url = "https://pypi.apple.com"

[server]
follow_symlink = true

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "W", "I", "B", "SIM", "UP"]
ignore = ["B018"]

[tool.ruff.format]
quote-style = "double"
